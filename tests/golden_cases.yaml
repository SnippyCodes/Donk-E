  Q9:
    id: Q9
    question: "Which rules has WELL-0001 broken in the last 12 months, and what is still open?"
    well_id: "WELL-0001"
    window: "last 12 months"
    visual: "table"
    expected:
      breaches_count: 4
      breaches:
        - protocol_id: "SR-01"
          description: "Written spill report filed after 41 hours against 24-hour limit"
          discovery_inspection_id: "INS-0001-0185"
          event_id: "REG-0001-001"
          nov_event_id: "REG-0001-002"
          fine_usd: 5000
          fine_status: "open"
        - protocol_id: "SR-02"
          description: "Containment took ~7 hours against 4-hour limit"
          report_id: "MNT-0001-029"
          hours_to_contain: 7.0
        - protocol_id: "SR-03"
          description: "Cleanup agency verification due by 2026-08-10 (60 days) and still open"
          event_id: "REG-0001-003"
          status: "open"
        - protocol_id: "RC-04"
          description: "NOV response due by 2026-07-30 (30 days from 2026-06-30 notice), no response recorded"
          nov_event_id: "REG-0001-002"
      total_open_fines_usd: 5000
      pending_actions:
        - item: "flowline_rca"
          description: "Root-cause analysis due on flowline (3 corrective repairs in 12 months: MNT-0001-028, MNT-0001-029, MNT-0001-032)"
          status: "Action required"
        - item: "planned_shutin_unrecorded"
          description: "Planned shut-in from 7 Oct not yet recorded in maintenance system (T200 manual §4)"
          note_id: "CTX-0001-003"
      rules_met:
        - protocol_id: "RC-02"
          description: "Annual flowline integrity test passed on 2026-03-07"
          maintenance_id: "MNT-0001-026"

  Q10:
    id: Q10
    question: "In Southwest Block 24, which spills in the last 90 days were not contained within the SOP time limit?"
    area_id: "SW-24"
    area_name: "Southwest Block 24"
    window: "last 90 days"
    visual: "table"
    expected:
      limit_hours: 4.0
      count: 2
      items:
        - well_id: "WELL-0082"
          contained_hours: 7.1
          report_id: "MNT-0082-028"
          inspection_id: "INS-0082-0198"
          date: "2026-09-10"
        - well_id: "WELL-0100"
          contained_hours: 8.1
          report_id: "MNT-0100-034"
          inspection_id: "INS-0100-0196"
          date: "2026-09-10"

  Q11:
    id: Q11
    user_id: "U-201"
    user_name: "Michael Turner"
    question: "For the three wells we discussed yesterday, what have repairs cost this year?"
    expected:
      recalled_wells: ["WELL-0121", "WELL-0138", "WELL-0107"]
      costs:
        WELL-0121: 25794
        WELL-0138: 46942
        WELL-0107: 5176

  Q12:
    id: Q12
    user_id: "U-201"
    action: "data_correction"
    inspection_id: "INS-0164-0205"
    corrected_wellhead_temp: 41.0
    original_wellhead_temp: 24.0
    expected:
      updated_is_producing: true
      conflict_detected: true
      conflicting_inspector_note: "Pump jack not moving."
      q2_reeval_count: 3
      removed_well: "WELL-0164"

  Q13:
    id: Q13
    user_id: "U-201"
    action: "ai_estimate_correction"
    inspection_id: "INS-0151-0201"
    corrected_volume_bbl: 5.4
    original_volume_bbl: 4.5
    expected:
      becomes_reportable: true
      sr01_breach: true
      sr03_due_date: "2026-11-23"

  Q14:
    id: Q14
    user_id: "U-201"
    action: "type_rule_override"

cases:
  Q1:
    id: Q1
    question: "Is WELL-0001 producing oil right now? When was it last inspected, and by whom? Show me its status card."
    well_id: "WELL-0001"
    visual: "status_card"
    expected:
      is_producing: false
      latest_inspection_id: "INS-0001-0203"
      inspected_at: "2026-10-15T09:45:00Z"
      inspected_date: "2026-10-15"
      inspector_user_id: "U-104"
      inspector_name: "Ryan Brooks"
      method: "drone"
      ambient_temp_c: 22.4
      wellhead_temp_c: 25.6
      delta_temp_c: 3.2
      threshold_delta_c: 15.0
      threshold_temp_delta: 15.0
      well_type: "T200"
      recorded_status: "active"
      status_is_stale: true
      reason_note_id: "CTX-0001-003"
      reason_author: "Jake Morales"
      reason_text_snippet: "planned rod string replacement"
      evidence_ids: ["INS-0001-0203", "CTX-0001-003", "DOC:OM-T200#9.3"]

  Q2:
    id: Q2
    question: "Which wells in Northeast Block 8 are not producing oil right now, and why? Show them in a table."
    area_id: "NE-08"
    area_name: "Northeast Block 8"
    visual: "table"
    expected:
      count: 4
      wells:
        WELL-0164:
          delta_temp_c: 4.1
          recorded_status: "active"
          status_is_stale: true
          reason_type: "no_recorded_reason"
          inspector_note: "Pump jack not moving."
          evidence_ids: ["INS-0164-0205"]
        WELL-0170:
          delta_temp_c: 2.9
          recorded_status: "down"
          status_is_stale: false
          reason_type: "repair"
          repair_id: "MNT-0170-031"
          issue: "pump jack walking beam bearing wear"
          started_at: "2026-09-19"
          evidence_ids: ["INS-0170-0205", "MNT-0170-031"]
        WELL-0172:
          delta_temp_c: 5.7
          recorded_status: "active"
          status_is_stale: true
          reason_type: "repair"
          repair_id: "MNT-0172-028"
          issue: "flowline pinhole leak"
          started_at: "2026-10-03"
          evidence_ids: ["INS-0172-0205", "MNT-0172-028"]
        WELL-0175:
          delta_temp_c: 0.4
          recorded_status: "active"
          status_is_stale: true
          reason_type: "no_recorded_reason"
          inspector_note: null
          evidence_ids: ["INS-0175-0205"]

  Q3:
    id: Q3
    question: "Show a line chart of WELL-0001's wellhead temperature against air temperature for the last 13 weeks, and mark when it was not producing oil."
    well_id: "WELL-0001"
    window: "last 13 weeks"
    visual: "line_chart"
    expected:
      readings_count: 13
      start_date: "2026-07-23"
      end_date: "2026-10-15"
      non_producing_dates:
        - "2026-10-08"
        - "2026-10-15"
      evidence_ids: ["INS-0001-0191", "INS-0001-0203", "DOC:OM-T200#9.3"]

  Q4:
    id: Q4
    question: "How many oil spills has WELL-0001 had in the last 4 years, and how much oil in total? List them in a table."
    well_id: "WELL-0001"
    window: "last 4 years"
    visual: "table"
    expected:
      total_detections: 7
      corrected_detections: 1
      corrected_inspection_id: "INS-0001-0070"
      corrected_note_id: "CTX-0001-001"
      real_spills_count: 6
      total_volume_bbl: 15.1
      spills:
        - date: "2023-03-16"
          volume_bbl: 0.5
          inspection_id: "INS-0001-0021"
        - date: "2023-04-27"
          volume_bbl: 2.6
          inspection_id: "INS-0001-0027"
        - date: "2023-09-28"
          volume_bbl: 3.3
          inspection_id: "INS-0001-0048"
        - date: "2023-10-19"
          volume_bbl: 0.3
          inspection_id: "INS-0001-0051"
        - date: "2026-06-11"
          volume_bbl: 6.8
          inspection_id: "INS-0001-0185"
        - date: "2026-10-01"
          volume_bbl: 1.6
          inspection_id: "INS-0001-0201"

  Q5:
    id: Q5
    question: "How many days was WELL-0001 down in 2025?"
    well_id: "WELL-0001"
    window: "2025"
    visual: null
    expected:
      downtime_days: 21
      down_inspections_count: 3
      inspections:
        - date: "2025-07-24"
          wellhead_temp_c: 51.6
          ambient_temp_c: 43.1
          delta_temp_c: 8.5
          cause_repair_id: "MNT-0001-021"
          cause_issue: "Prime mover tripped on thermal overload"
        - date: "2025-10-16"
          wellhead_temp_c: 26.6
          ambient_temp_c: 23.2
          delta_temp_c: 3.4
          cause_repair_id: "MNT-0001-023"
          cause_issue: "Stuffing box packing failure"
        - date: "2025-10-23"
          wellhead_temp_c: 16.0
          ambient_temp_c: 16.6
          delta_temp_c: -0.6
          cause_repair_id: "MNT-0001-023"
          cause_issue: "Stuffing box packing failure"

  Q6:
    id: Q6
    question: "Which 3 wells in Northeast Block 7 had the most downtime in the last 4 months? Show a bar chart."
    area_id: "NE-07"
    area_name: "Northeast Block 7"
    window: "last 4 months"
    visual: "bar_chart"
    expected:
      window_start: "2026-06-16"
      window_end: "2026-10-16"
      top_3:

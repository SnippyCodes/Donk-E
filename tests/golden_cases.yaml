  Q8:
    id: Q8
    question: "Show a heatmap of 2026 spills by geographic area and month."
    window: "2026"
    visual: "heatmap"
    expected:
      areas:
        "Southwest Block 23":
          monthly_counts: [4, 3, 3, 6, 3, 4, 4, 3, 3, 2]
          total: 35
        "Southwest Block 24":
          monthly_counts: [7, 4, 5, 6, 5, 5, 3, 1, 5, 2]
          total: 43
        "Northeast Block 7":
          monthly_counts: [5, 3, 2, 4, 6, 6, 2, 4, 4, 1]
          total: 37
        "Northeast Block 8":
          monthly_counts: [4, 4, 4, 3, 2, 4, 4, 0, 1, 0]

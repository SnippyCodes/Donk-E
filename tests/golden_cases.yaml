        - well_id: "WELL-0138"
          downtime_days: 42
          well_type: "T350"
        - well_id: "WELL-0107"
          downtime_days: 42
          well_type: "T350"
      runner_up:
        well_id: "WELL-0119"
        downtime_days: 28
        well_type: "T200"

